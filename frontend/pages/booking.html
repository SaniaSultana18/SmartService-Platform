<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Service - SmartService</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>SmartService</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <main>

        <section class="form-section">

            <h2>Book a Service</h2>

            <form action="confirmation.html"></form>

                <label for="service">Service</label>

                <select id="service">
                    <option value="ac-repair">AC Repair</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="electrical">Electrical</option>
                    <option value="cleaning">Cleaning</option>
                </select>


                <label for="provider">Provider</label>

                <select id="provider">
                    <option value="rahul">Rahul Kumar</option>
                    <option value="arjun">Arjun Services</option>
                    <option value="coolcare">CoolCare Experts</option>
                </select>


                <label for="date">Preferred Date</label>
                <input type="date" id="date">


                <label for="time">Preferred Time</label>
                <input type="time" id="time">


                <label for="address">Service Address</label>
                <input type="text" id="address" placeholder="Enter your address">


                <button type="submit">Confirm Booking</button>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 SmartService. All rights reserved.</p>
    </footer>

</body>

</html>
