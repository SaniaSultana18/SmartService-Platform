<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartService - Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header class="header">
        <h1>SmartService Admin</h1>
        <button id="logoutBtn">Logout</button>
    </header>

    <main class="container">
        <h2>Booking Management</h2>
        <p>View and manage all customer bookings.</p>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <p id="confirmedBookings">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedBookings">0</p>
            </div>
        </div>

        <section class="booking-section">
            <h2>All Bookings</h2>

            <div id="message"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Provider</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="bookingTableBody">
                        <tr>
                            <td colspan="7">Loading bookings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/admin-bookings.js"></script>
</body>
</html>
